<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projects — Kathia Anaid</title>
  <meta name="description" content="Selected projects — Designer." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    /* ---------- Reset ---------- */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    img, svg { display: block; max-width: 100%; height: auto; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; background: none; border: none; cursor: pointer; padding: 0; color: inherit; }

    /* ---------- Tokens ---------- */
    :root {
      --bg: #ffffff;
      --ink: #111111;
      --muted: #6f6f6f;
      --rule: #ededed;
      --mint: #cfe9d2;
      --mint-strong: #b9dfbe;
      --sans: "Jost", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --pad: clamp(20px, 4vw, 40px);
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ---------- Header (same wordmark as home) ---------- */
    .site-header {
      padding: clamp(28px, 4vw, 44px) var(--pad) clamp(28px, 4vw, 56px);
      display: flex; justify-content: center; align-items: center;
    }
    .wordmark {
      font-weight: 400;
      font-size: clamp(20px, 2.4vw, 28px);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      display: flex;
      gap: clamp(24px, 4vw, 48px);
      margin: 0;
    }

    /* ---------- Grid of project tiles ---------- */
    .grid {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 var(--pad) clamp(120px, 14vh, 180px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(8px, 1vw, 16px);
    }

    .tile {
      position: relative;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #efece5;
      cursor: pointer;
      outline: none;
      border-radius: 4px;
    }
    .tile-img {
      position: absolute; inset: 0;
      background-size: cover;
      background-position: center;
      transform: scale(1);
      transition: transform .9s cubic-bezier(.22,.61,.36,1), filter .4s ease;
    }
    .tile:hover .tile-img,
    .tile:focus-visible .tile-img {
      transform: scale(1.04);
      filter: brightness(.78);
    }

    .tile-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: clamp(20px, 2.4vw, 32px);
      color: #fff;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .35s ease, transform .35s ease;
      pointer-events: none;
    }
    .tile:hover .tile-overlay,
    .tile:focus-visible .tile-overlay {
      opacity: 1;
      transform: translateY(0);
    }
    .tile-overlay .num {
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      opacity: .85;
      margin: 0 0 6px;
    }
    .tile-overlay h3 {
      font-weight: 400;
      font-size: clamp(18px, 1.6vw, 24px);
      letter-spacing: 0.04em;
      margin: 0 0 4px;
    }
    .tile-overlay .tag {
      font-size: 12px;
      letter-spacing: 0.06em;
      opacity: .9;
      margin: 0;
    }

    .tile:focus-visible {
      outline: 2px solid var(--mint-strong);
      outline-offset: 4px;
    }

    /* placeholder gradients (swap for real images via inline style or .tile-img bg) */
    .ph-1 { background-image: linear-gradient(135deg,#dcd3c2,#7a6648); }
    .ph-2 { background-image: linear-gradient(160deg,#f0e4ce,#caa367); }
    .ph-3 { background-image: linear-gradient(150deg,#cfd6df,#54647a); }
    .ph-4 { background-image: linear-gradient(140deg,#1f1f1f,#3c3c3c); }
    .ph-5 { background-image: linear-gradient(155deg,#e8d3c0,#9b6a4a); }
    .ph-6 { background-image: linear-gradient(135deg,#dde6e2,#6a8c80); }

    /* ---------- Floating bottom nav (same as home) ---------- */
    .floating-nav {
      position: fixed;
      bottom: clamp(20px, 3vh, 32px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      align-items: center;
      gap: clamp(10px, 1.4vw, 18px);
      flex-wrap: wrap;
      justify-content: center;
    }
    .pill {
      border: 1px solid #d8d8d8;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(8px);
      border-radius: 999px;
      padding: 14px clamp(20px, 2.4vw, 32px);
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink);
      transition: opacity .3s ease, transform .3s ease, background .2s ease, border-color .2s ease;
      white-space: nowrap;
    }
    .pill:hover { background: #fafafa; border-color: #c4c4c4; transform: translateY(-1px); }

    .toggle {
      width: 52px; height: 52px;
      border-radius: 999px;
      background: var(--mint);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background .25s ease, transform .25s ease, box-shadow .25s ease, width .25s ease, height .25s ease;
      flex-shrink: 0;
      box-shadow: 0 6px 20px rgba(143, 199, 154, .35);
    }
    .toggle:hover { background: var(--mint-strong); transform: rotate(90deg); }
    .toggle svg { width: 18px; height: 18px; stroke: #1d1d1d; stroke-width: 1.5; fill: none; }

    body[data-nav="expanded"] .toggle { width: 44px; height: 44px; box-shadow: 0 4px 12px rgba(143,199,154,.3); }
    body[data-nav="expanded"] .toggle svg { width: 16px; height: 16px; }

    body[data-nav="collapsed"] .pill {
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      width: 0;
      padding: 0;
      border: 0;
      margin: 0;
      overflow: hidden;
      white-space: nowrap;
    }
    body[data-nav="collapsed"] .toggle .x { display: none; }
    body[data-nav="expanded"]  .toggle .plus { display: none; }

    ::selection { background: var(--mint); color: var(--ink); }

    /* ---------- Responsive ---------- */
    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 540px) {
      .grid { grid-template-columns: 1fr; }
      .wordmark { letter-spacing: 0.24em; gap: 18px; }
    }
  </style>
</head>
<body data-nav="collapsed">

  <header class="site-header">
    <a href="index.html" aria-label="Home">
      <h1 class="wordmark">
        <span>Kathia</span>

  <main>
    <section class="grid" aria-label="Selected projects">

      <a class="tile" href="#" aria-label="Quiet Hours — view project">

      <a class="tile" href="#" aria-label="Coastal Notes — view project">

      <a class="tile" href="#" aria-label="Field Marks — view project">
        <div class="tile-img ph-5" aria-hidden="true"></div>

      <a class="tile" href="#" aria-label="Hometide — view project">

    </section>
  </main>

  <!-- Floating bottom nav -->
  <nav class="floating-nav" aria-label="Sections">
    <a class="pill" href="index.html">Home</a>
    <a class="pill" href="index.html#about">About</a>
    <button class="toggle" type="button" aria-label="Open menu" aria-expanded="false">
      <svg class="x" viewBox="0 0 24 24" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      <svg class="plus" viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <a class="pill" href="mailto:kathiaawork@gmail.com">Contact</a>
    <a class="pill" href="https://www.instagram.com/studionotes_?igsh=MTlxcDAxN3llYzBvMw%3D%3D" target="_blank" rel="noopener">Instagram</a>
  </nav>

  <script>
    const body = document.body;
    const toggle = document.querySelector('.toggle');
    toggle.addEventListener('click', () => {
      const expanded = body.dataset.nav === 'expanded';
      body.dataset.nav = expanded ? 'collapsed' : 'expanded';
      toggle.setAttribute('aria-expanded', String(!expanded));
      toggle.setAttribute('aria-label', expanded ? 'Open menu' : 'Close menu');
    });
  </script>
</body>
</html>
