<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Work — Kathia Anaid</title>
  <meta name="description" content="AI Work — Kathia Anaid" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    img, svg { display: block; max-width: 100%; height: auto; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; background: none; border: none; cursor: pointer; padding: 0; color: inherit; }

    :root {
      --bg: #ffffff;
      --ink: #111111;
      --muted: #6f6f6f;
      --rule: #ededed;
      --mint: #cfe9d2;
      --mint-strong: #b9dfbe;
      --sans: "Jost", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --pad: clamp(20px, 4vw, 40px);
      --maxw: 1100px;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Header ── */
    .site-header {
      padding: clamp(28px, 4vw, 44px) var(--pad);
      display: flex;
      justify-content: center;
    }
    .wordmark {
      font-weight: 400;
      font-size: clamp(20px, 2.4vw, 28px);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      display: flex;
      gap: clamp(24px, 4vw, 48px);
      margin: 0;
    }

    /* ── Content ── */
    .content {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: clamp(40px, 6vw, 64px) var(--pad) clamp(40px, 5vw, 56px);
    }

    .meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: clamp(32px, 5vw, 48px);
      padding-bottom: clamp(28px, 4vw, 40px);
      border-bottom: 1px solid var(--rule);
    }
    .meta-label { font-size: 11px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--muted); margin: 0; }
    .meta h1    { font-size: clamp(32px, 5vw, 56px); font-weight: 400; letter-spacing: 0.04em; margin: 0; line-height: 1.1; }
    .meta-tags  { font-size: 13px; letter-spacing: 0.08em; color: var(--muted); margin: 8px 0 0; }

    .intro { max-width: 620px; font-size: clamp(15px, 1.4vw, 18px); line-height: 1.75; }
    .intro p { margin: 0 0 1em; }
    .intro p:last-child { margin: 0; }

    /* ── Image Grid ── */
    .grid-section {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 var(--pad) clamp(60px, 8vw, 100px);
    }

    .img-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .grid-item {
      aspect-ratio: 350 / 500;
      border-radius: 0;
      overflow: hidden;
      cursor: pointer;
      background: #f0ede8;
      position: relative;
    }

    .grid-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .5s cubic-bezier(.22,.61,.36,1);
      pointer-events: none;
    }

    .grid-item:hover img { transform: scale(1.04); }

    .grid-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #e8e5de, #d6d3cb);
      color: #b0ada5;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    /* ── Lightbox ── */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(8,8,8,.90);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
    }
    .lightbox.open { opacity: 1; pointer-events: all; }

    .lb-img {
      max-width: min(90vw, 1000px);
      max-height: 88vh;
      object-fit: contain;
      border-radius: 12px;
      display: block;
      box-shadow: 0 40px 120px rgba(0,0,0,.5);
    }

    .lb-close {
      position: fixed;
      top: 22px; right: 22px;
      width: 46px; height: 46px;
      border-radius: 50%;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.22);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background .2s ease, transform .2s ease;
      flex-shrink: 0;
    }
    .lb-close svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 1.8; fill: none; }
    .lb-close:hover { background: rgba(255,255,255,.26); transform: rotate(90deg); }

    /* ── Project nav ── */
    .project-nav {
      max-width: var(--maxw);
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: clamp(32px,4vw,48px) var(--pad) clamp(100px,14vh,160px);
      border-top: 1px solid var(--rule);
    }
    .project-nav a { font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); transition: color .2s ease; }
    .project-nav a:hover { color: var(--ink); }

    /* ── Floating nav ── */
    .floating-nav {
      position: fixed;
      bottom: clamp(20px,3vh,32px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      align-items: center;
      gap: clamp(10px,1.4vw,18px);
      flex-wrap: wrap;
      justify-content: center;
    }
    .pill {
      border: 1px solid #d8d8d8;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(8px);
      border-radius: 999px;
      padding: 14px clamp(20px,2.4vw,32px);
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink);
      transition: opacity .3s ease, transform .3s ease, background .2s ease, border-color .2s ease;
      white-space: nowrap;
    }
    .pill:hover { background: #fafafa; border-color: #c4c4c4; transform: translateY(-1px); }
    .toggle {
      width: 52px; height: 52px;
      border-radius: 999px;
      background: var(--mint);
      display: inline-flex; align-items: center; justify-content: center;
      transition: background .25s ease, transform .25s ease, box-shadow .25s ease, width .25s ease, height .25s ease;
      flex-shrink: 0;
      box-shadow: 0 6px 20px rgba(143,199,154,.35);
    }
    .toggle:hover { background: var(--mint-strong); transform: rotate(90deg); }
    .toggle svg { width: 18px; height: 18px; stroke: #1d1d1d; stroke-width: 1.5; fill: none; }
    body[data-nav="expanded"] .toggle { width: 44px; height: 44px; box-shadow: 0 4px 12px rgba(143,199,154,.3); }
    body[data-nav="expanded"] .toggle svg { width: 16px; height: 16px; }
    body[data-nav="collapsed"] .pill {
      opacity: 0; transform: translateY(8px); pointer-events: none;
      width: 0; padding: 0; border: 0; margin: 0; overflow: hidden; white-space: nowrap;
    }
    body[data-nav="collapsed"] .toggle .x  { display: none; }
    body[data-nav="expanded"]  .toggle .plus { display: none; }

    ::selection { background: var(--mint); color: var(--ink); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

    @media (max-width: 768px) {
      .img-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .img-grid { grid-template-columns: 1fr; gap: 12px; }
    }
  </style>
</head>
<body data-nav="collapsed">

  <script>
    /* ── Floating nav ── */
    const body   = document.body;
    const toggle = document.querySelector('.toggle');
    toggle.addEventListener('click', () => {
      const exp = body.dataset.nav === 'expanded';
      body.dataset.nav = exp ? 'collapsed' : 'expanded';
      toggle.setAttribute('aria-expanded', String(!exp));
      toggle.setAttribute('aria-label', exp ? 'Open menu' : 'Close menu');
    });

    /* ── Lightbox ── */
    const lb      = document.getElementById('lightbox');
    const lbImg   = document.getElementById('lbImg');
    const lbClose = document.getElementById('lbClose');

    function openLightbox(src, alt) {
      lbImg.src = src;
      lbImg.alt = alt || '';
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
      setTimeout(() => { lbImg.src = ''; }, 320);
    }

    lbClose.addEventListener('click', closeLightbox);
    lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && lb.classList.contains('open')) closeLightbox();
    });

    /* ── Grid click → lightbox ── */
    document.querySelectorAll('.grid-item').forEach(item => {
      const open = () => {
        const img = item.querySelector('img');
        if (img) openLightbox(img.src, img.alt);
      };
      item.addEventListener('click', open);
      item.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
      });
    });
  </script>
